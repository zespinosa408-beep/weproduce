<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un Mensaje Para Ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap">
<style>
  :root{
    --papel:#f4f6f9;
    --hoja:#ffffff;
    --tinta:#161d2e;
    --apagado:#5f6a80;
    --linea:#dfe4ec;
    --pluma:#2a3f9d;
    --pluma-tenue:#e8ecfb;
    --burbuja:#eef1f8;
    --oro:#8a6410;      --oro-tenue:#fbf1dc;
    --verde:#1f6b4e;    --verde-tenue:#e3f2ea;
    --rosa:#b3324f;     --rosa-tenue:#fceaee;
    --curva:12px;
    --relieve:0 1px 1px rgba(22,29,46,.04), 0 8px 24px -12px rgba(22,29,46,.14);
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --texto:"Karla",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --papel:#12151d;
      --hoja:#1a1f2b;
      --tinta:#e9ecf4;
      --apagado:#98a1b5;
      --linea:#2b3242;
      --pluma:#8fa4ff;
      --pluma-tenue:#212a47;
      --burbuja:#232a3a;
      --oro:#e2b662;    --oro-tenue:#33270f;
      --verde:#7cc9a4;  --verde-tenue:#15281f;
      --rosa:#f0839a;   --rosa-tenue:#341721;
      --relieve:0 1px 1px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --papel:#12151d;
    --hoja:#1a1f2b;
    --tinta:#e9ecf4;
    --apagado:#98a1b5;
    --linea:#2b3242;
    --pluma:#8fa4ff;
    --pluma-tenue:#212a47;
    --burbuja:#232a3a;
    --oro:#e2b662;    --oro-tenue:#33270f;
    --verde:#7cc9a4;  --verde-tenue:#15281f;
    --rosa:#f0839a;   --rosa-tenue:#341721;
    --relieve:0 1px 1px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--papel); color:var(--tinta);
    font:400 17px/1.55 var(--texto);
    -webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
  }
  .envoltura{max-width:680px;margin:0 auto;padding:0 16px 96px}

  :where(a,button,input,select,textarea,summary):focus-visible{
    outline:2px solid var(--pluma); outline-offset:2px; border-radius:6px;
  }

  /* ── Encabezado ───────────────────────────────────────── */
  header.cabecera{padding:26px 0 16px;text-align:center}
  header.cabecera h1{
    margin:0; font:600 27px/1.15 var(--display);
    font-variation-settings:"opsz" 40,"SOFT" 30;
    letter-spacing:-.012em; text-wrap:balance;
  }
  header.cabecera p{
    margin:6px 0 0; color:var(--apagado); font-size:14px;
    letter-spacing:.02em; font-variant-numeric:tabular-nums;
  }

  /* ── Pestañas ─────────────────────────────────────────── */
  nav.pestanas{
    position:sticky; top:0; z-index:20;
    display:flex; gap:2px; padding:8px 0 9px; margin-bottom:20px;
    background:var(--papel); border-bottom:1px solid var(--linea);
  }
  nav.pestanas button{
    flex:1; padding:10px 3px; cursor:pointer;
    font:600 15px/1.2 var(--texto); letter-spacing:.005em;
    background:transparent; color:var(--apagado);
    border:0; border-radius:9px;
  }
  nav.pestanas button:hover{color:var(--tinta)}
  nav.pestanas button[aria-selected="true"]{background:var(--pluma-tenue); color:var(--pluma)}
  .globo{
    display:inline-block; min-width:19px; margin-left:5px; padding:0 5px;
    background:var(--pluma); color:var(--hoja);
    border-radius:99px; font:700 12px/19px var(--texto);
    font-variant-numeric:tabular-nums;
  }

  /* ── Tarjetas ─────────────────────────────────────────── */
  .tarjeta{
    background:var(--hoja); border:1px solid var(--linea); border-radius:var(--curva);
    padding:18px; margin-bottom:14px; box-shadow:var(--relieve);
  }
  .tarjeta h2{
    margin:0 0 10px; font:600 18px/1.25 var(--display);
    font-variation-settings:"opsz" 24,"SOFT" 20;
  }
  .tarjeta p.acota{margin:0; color:var(--apagado); font-size:15px}

  .quien{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:13px}
  .quien .nombre{
    font:600 21px/1.2 var(--display);
    font-variation-settings:"opsz" 30,"SOFT" 30;
    letter-spacing:-.01em; margin-right:2px;
  }

  .etiqueta{
    display:inline-block; padding:3px 9px; border-radius:6px;
    font:600 12.5px/1.35 var(--texto); letter-spacing:.02em;
    background:var(--burbuja); color:var(--apagado);
  }
  .etiqueta.oro{background:var(--oro-tenue); color:var(--oro)}
  .etiqueta.verde{background:var(--verde-tenue); color:var(--verde)}
  .etiqueta.nota{background:transparent; color:var(--apagado); padding-left:0; font-weight:400; font-style:italic}

  /* ── La burbuja: el borrador con la forma del mensaje ── */
  .burbuja{position:relative; margin-bottom:16px}
  .burbuja::after{
    content:""; position:absolute; left:15px; bottom:-8px;
    border:9px solid transparent; border-top-color:var(--burbuja); border-bottom:0;
  }
  textarea.borrador{
    display:block; width:100%; min-height:128px; padding:15px 16px;
    font:400 16.5px/1.55 var(--texto); color:var(--tinta);
    background:var(--burbuja); border:1px solid transparent;
    border-radius:14px 14px 14px 4px; resize:vertical;
  }
  textarea.borrador:focus{border-color:var(--pluma); outline:none}

  /* ── Botones ──────────────────────────────────────────── */
  .botones{display:flex; gap:8px; flex-wrap:wrap}
  button.b{
    font:600 15px/1.2 var(--texto); padding:12px 15px; cursor:pointer;
    border:1px solid var(--linea); border-radius:9px;
    background:var(--hoja); color:var(--tinta);
  }
  button.b:hover{border-color:var(--apagado)}
  button.b.principal{
    flex:1 1 100%; background:var(--pluma); border-color:var(--pluma);
    color:var(--hoja); padding:14px 16px; font-size:16px;
  }
  button.b.principal:hover{filter:brightness(1.12)}
  button.b.tenue{background:transparent; border-color:transparent; color:var(--apagado)}
  button.b.tenue:hover{color:var(--tinta); border-color:var(--linea)}
  button.b.peligro{background:transparent; border-color:transparent; color:var(--rosa)}
  button.b.peligro:hover{border-color:var(--rosa)}

  /* ── Formularios ──────────────────────────────────────── */
  label.campo{display:block; margin-bottom:14px}
  label.campo > span{
    display:block; margin-bottom:6px;
    font:600 13px/1.3 var(--texto); letter-spacing:.05em; text-transform:uppercase;
  }
  label.campo .pista{text-transform:none; letter-spacing:0; font-weight:400; color:var(--apagado)}
  input[type=text],input[type=tel],input[type=date],select{
    width:100%; padding:12px; font:400 16px/1.4 var(--texto);
    background:var(--papel); color:var(--tinta);
    border:1px solid var(--linea); border-radius:9px;
  }
  input:focus,select:focus{outline:none; border-color:var(--pluma); box-shadow:0 0 0 3px var(--pluma-tenue)}
  .fila{display:flex; gap:10px; flex-wrap:wrap}
  .fila > *{flex:1 1 150px}

  .casillas{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
  .casillas label{
    display:flex; align-items:center; gap:8px; padding:9px 13px; cursor:pointer;
    font-size:15px; background:var(--hoja);
    border:1px solid var(--linea); border-radius:99px;
  }
  .casillas label:has(input:checked){
    background:var(--pluma-tenue); border-color:var(--pluma); color:var(--pluma); font-weight:600;
  }
  .casillas input{accent-color:var(--pluma); width:17px; height:17px}

  .consentimiento{
    margin:2px 0 16px; padding:14px; font-size:14.5px; line-height:1.5;
    background:var(--pluma-tenue); border-left:3px solid var(--pluma); border-radius:0 9px 9px 0;
  }
  .consentimiento label{display:flex; gap:10px; align-items:flex-start; cursor:pointer; font-weight:600}
  .consentimiento input{flex:none; margin-top:3px; accent-color:var(--pluma); width:18px; height:18px}

  /* ── Listas ───────────────────────────────────────────── */
  ul.lista{list-style:none; margin:0; padding:0}
  ul.lista li{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:14px 0; border-bottom:1px solid var(--linea);
  }
  ul.lista li:last-child{border-bottom:0}
  ul.lista li:first-child{padding-top:2px}
  .datos{min-width:0}
  .datos b{font:600 17px/1.3 var(--display); font-variation-settings:"opsz" 20,"SOFT" 25}
  .datos small{display:block; margin-top:2px; color:var(--apagado); font-size:13.5px; line-height:1.45}

  .mensaje-item{padding:12px 0; border-bottom:1px solid var(--linea); font-size:16px; line-height:1.5}
  .mensaje-item:last-child{border-bottom:0}
  .mensaje-item small{
    display:block; margin-top:3px; color:var(--apagado);
    font-size:12px; letter-spacing:.05em; text-transform:uppercase; font-weight:600;
  }

  /* ── Plegables ────────────────────────────────────────── */
  details.plegable{
    margin-bottom:14px; background:var(--hoja);
    border:1px solid var(--linea); border-radius:var(--curva); box-shadow:var(--relieve);
  }
  details.plegable > summary{
    padding:15px 17px; cursor:pointer; list-style:none;
    font:600 16px/1.3 var(--display); font-variation-settings:"opsz" 20,"SOFT" 25;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  details.plegable > summary::-webkit-details-marker{display:none}
  details.plegable > summary::after{content:"+"; color:var(--apagado); font:400 20px/1 var(--texto)}
  details.plegable[open] > summary::after{content:"–"}
  details.plegable > div{padding:0 17px 17px}

  /* ── Avisos ───────────────────────────────────────────── */
  .aviso{
    margin-bottom:14px; padding:15px 17px; font-size:14.5px; line-height:1.55;
    background:var(--oro-tenue); color:var(--oro);
    border-left:3px solid var(--oro); border-radius:0 var(--curva) var(--curva) 0;
  }
  .aviso b.titulo{
    display:block; margin-bottom:5px;
    font:600 15.5px/1.3 var(--display); font-variation-settings:"opsz" 20,"SOFT" 25;
  }

  .vacio{text-align:center; padding:42px 20px}
  .vacio strong{
    display:block; margin-bottom:7px;
    font:600 20px/1.25 var(--display); font-variation-settings:"opsz" 30,"SOFT" 30;
    text-wrap:balance;
  }
  .vacio span{color:var(--apagado)}

  table.cuenta{width:100%; border-collapse:collapse; font-size:15px}
  table.cuenta td{padding:9px 0; border-bottom:1px solid var(--linea)}
  table.cuenta td:last-child{
    text-align:right; font-weight:700; font-variant-numeric:tabular-nums;
  }
  table.cuenta tr:last-child td{border-bottom:0}

  .brindis{
    position:fixed; left:50%; bottom:24px; z-index:60; max-width:90vw;
    transform:translateX(-50%) translateY(12px);
    padding:13px 22px; border-radius:99px; text-align:center;
    background:var(--tinta); color:var(--papel);
    font:600 15px/1.3 var(--texto);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.45);
  }
  .brindis.ver{opacity:1; transform:translateX(-50%) translateY(0)}

  .nota-pie{
    padding:10px 12px 0; text-align:center;
    color:var(--apagado); font-size:13.5px; line-height:1.5;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important; scroll-behavior:auto !important}
  }
  [hidden]{display:none !important}
</style>
</head>
<body>

<div class="envoltura">
  <header class="cabecera">
    <h1 id="tituloProyecto">Un Mensaje Para Ti</h1>
    <p id="subtitulo">Cargando…</p>
  </header>

  <nav class="pestanas" role="tablist">
    <button role="tab" data-vista="hoy" aria-selected="true">Hoy <span class="globo" id="globoHoy" hidden>0</span></button>
    <button role="tab" data-vista="personas" aria-selected="false">Personas</button>
    <button role="tab" data-vista="mensajes" aria-selected="false">Mensajes</button>
    <button role="tab" data-vista="ajustes" aria-selected="false">Ajustes</button>
  </nav>

  <section id="vista-hoy"></section>
  <section id="vista-personas" hidden></section>
  <section id="vista-mensajes" hidden></section>
  <section id="vista-ajustes" hidden></section>

  <p class="nota-pie">
    Todo se guarda solo en este dispositivo. Exporta una copia cada semana desde <b>Ajustes</b>.
  </p>
</div>

<div class="brindis" id="brindis" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ─────────────────────────────────────────────────────────────

   Para agregar uno: copia una línea y cámbiale el texto.
   ───────────────────────────────────────────────────────────── */

  {id:45, t:"cumple", x:"¡Feliz cumpleaños! Hoy el mundo celebra que llegaste."},
  {id:46, t:"cumple", x:"Feliz cumpleaños. Que este año te trate con cariño."},
  {id:47, t:"cumple", x:"Feliz cumpleaños. Que hoy no se te olvide lo que vales."},

const TIPOS = {
  animo:      "Ánimo",
  amistad:    "Compañía",
  espiritual: "Espiritual",
  gratitud:   "Valor y gratitud",
  dificil:    "Días difíciles",
  cumple:     "Cumpleaños",
};

const FRECUENCIAS = {
  diaria:  "Todos los días",
  tres:    "Lunes, miércoles y viernes",
  semanal: "Una vez por semana",
};

const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

const NOTA_BAJA = "Si en algún momento prefieres dejar de recibirlos, solo dime BAJA y se detiene. Sin explicaciones.";
const CADA_CUANTAS_NOTAS_DE_BAJA = 8;

/* ─────────────────────────────────────────────────────────────
   Estado guardado en el dispositivo
   ───────────────────────────────────────────────────────────── */
const LLAVE = "unmensajeparati.v1";

const AJUSTES_INICIALES = {
  nombreProyecto: "Un Mensaje Para Ti",
  firma: "Un Mensaje Para Ti",
  lada: "+52",
  canal: "whatsapp",
};

let estado = cargar();
let vistaActual = "hoy";
let variantes = {};   // personaId -> cuántas veces se pidió "otro mensaje" hoy
let borradores = {};  // personaId -> texto editado a mano

function cargar(){
  try{
    const crudo = localStorage.getItem(LLAVE);
    if(crudo){
      const d = JSON.parse(crudo);
      return { personas: d.personas || [], ajustes: Object.assign({}, AJUSTES_INICIALES, d.ajustes || {}) };
    }
  }catch(e){ /* almacenamiento bloqueado o dato corrupto: se arranca en limpio */ }
  return { personas: [], ajustes: Object.assign({}, AJUSTES_INICIALES) };
}

function guardar(){
  try{
    localStorage.setItem(LLAVE, JSON.stringify({version:1, personas:estado.personas, ajustes:estado.ajustes}));
  }catch(e){
    brindar("No se pudo guardar en este navegador");
  }
}

/* ─────────────────────────────────────────────────────────────
   Fechas y utilerías
   ───────────────────────────────────────────────────────────── */
function hoyISO(d){
  const f = d || new Date();
  return f.getFullYear() + "-" + String(f.getMonth()+1).padStart(2,"0") + "-" + String(f.getDate()).padStart(2,"0");
}
function hoyMMDD(){ return hoyISO().slice(5); }

function fechaBonita(iso){
  if(!iso) return "";
  const [a,m,d] = iso.split("-").map(Number);
  return new Date(a, m-1, d).toLocaleDateString("es-MX", {day:"numeric", month:"long", year:"numeric"});
}

function escapar(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function idNuevo(){ return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function revoltura(txt){ // número estable a partir de un texto — para no barajar el mensaje en cada refresco
  let h = 0;
  for(let i=0;i<txt.length;i++){ h = (h*31 + txt.charCodeAt(i)) >>> 0; }
  return h;
}

function brindar(texto){
  const b = document.getElementById("brindis");
  b.textContent = texto;
  b.classList.add("ver");
  clearTimeout(brindar._t);
  brindar._t = setTimeout(() => b.classList.remove("ver"), 2600);
}

/* ─────────────────────────────────────────────────────────────
   Reglas: a quién le toca hoy
   ───────────────────────────────────────────────────────────── */
function esCumple(p){
  return !!p.cumple && p.cumple.slice(5) === hoyMMDD();
}

function leTocaHoy(p){
  if(!p.activo) return false;
  if(p.pausadoHasta && p.pausadoHasta >= hoyISO()) return false;
  if(p.historial.some(h => h.fecha === hoyISO())) return false;
  if(esCumple(p)) return true;

  const diaHoy = new Date().getDay();
  if(p.frecuencia === "diaria")  return true;
  if(p.frecuencia === "tres")    return diaHoy === 1 || diaHoy === 3 || diaHoy === 5;
  if(p.frecuencia === "semanal") return diaHoy === p.diaSemanal;
  return false;
}

function motivoNoToca(p){
  if(!p.activo) return "dada de baja";
  if(p.pausadoHasta && p.pausadoHasta >= hoyISO()) return "en pausa hasta el " + fechaBonita(p.pausadoHasta);
  if(p.historial.some(h => h.fecha === hoyISO())) return "ya recibió el de hoy";
  if(p.frecuencia === "tres")    return "le toca lunes, miércoles y viernes";
  if(p.frecuencia === "semanal") return "le toca los " + DIAS[p.diaSemanal];
  return "sin envío pendiente";
}

/* ─────────────────────────────────────────────────────────────
   Elegir el mensaje
   ───────────────────────────────────────────────────────────── */
function elegirMensaje(p){
  const cumple = esCumple(p);
  const tipos  = cumple ? ["cumple"] : (p.tipos.length ? p.tipos : ["animo","amistad"]);

  let posibles = MENSAJES.filter(m => tipos.includes(m.t));
  if(!posibles.length) posibles = MENSAJES.filter(m => m.t !== "cumple");

  // No repetir lo reciente. Si ya se agotaron, se reinicia la vuelta.
  const recientes = p.historial.slice(-Math.min(20, Math.max(1, posibles.length - 1))).map(h => h.mensajeId);
  const frescos = posibles.filter(m => !recientes.includes(m.id));
  const bolsa = frescos.length ? frescos : posibles;

  const salto = variantes[p.id] || 0;
  return bolsa[(revoltura(p.id + hoyISO()) + salto) % bolsa.length];
}

// "Don Ernesto" no se saluda como "Don". Los tratamientos se quedan pegados al nombre.
const TRATAMIENTOS = ["don","dona","doña","sr","sr.","sra","sra.","srta","srta.","senor","señor","senora",
                      "señora","padre","madre","hermano","hermana","tio","tío","tia","tía","abuelo","abuela",
                      "doctor","doctora","dr","dr.","dra","dra.","maestro","maestra","profe"];

function nombreDeSaludo(completo){
  const palabras = String(completo || "").trim().split(/\s+/).filter(Boolean);
  if(!palabras.length) return "";
  if(palabras.length > 1 && TRATAMIENTOS.includes(palabras[0].toLowerCase())) return palabras[0] + " " + palabras[1];
  return palabras[0];
}

function armarTexto(p, mensaje){
  const nombre = nombreDeSaludo(p.nombre);
  const partes = [];
  partes.push(nombre ? "Hola, " + nombre + "." : "Hola.");
  partes.push(mensaje.x);
  if(estado.ajustes.firma.trim()) partes.push("— " + estado.ajustes.firma.trim());
  if(p.historial.length > 0 && p.historial.length % CADA_CUANTAS_NOTAS_DE_BAJA === 0) partes.push(NOTA_BAJA);
  return partes.join("\n\n");
}

function telefonoLimpio(p){
  const solo = String(p.telefono || "").replace(/\D/g, "");
  if(!solo) return "";
  const lada = String(estado.ajustes.lada || "").replace(/\D/g, "");
  // Si ya trae la lada del país al inicio, o es más largo que un número local, se deja tal cual.
  if(!lada || solo.startsWith(lada) || solo.length > 11) return solo;
  return lada + solo;
}

function ligaEnvio(p, texto){
  const num = telefonoLimpio(p);
  if(estado.ajustes.canal === "sms"){
    return "sms:" + (num ? "+" + num : "") + "?&body=" + encodeURIComponent(texto);
  }
  return "https://wa.me/" + num + "?text=" + encodeURIComponent(texto);
}

/* ─────────────────────────────────────────────────────────────
   Acciones
   ───────────────────────────────────────────────────────────── */
function marcarEnviado(id, mensajeId){
  const p = estado.personas.find(x => x.id === id);
  if(!p) return;
  if(p.historial.some(h => h.fecha === hoyISO())) return;
  p.historial.push({fecha: hoyISO(), mensajeId: mensajeId});
  delete borradores[id];
  delete variantes[id];
  guardar(); pintar();
  brindar("Enviado a " + p.nombre);
}

function otroMensaje(id){
  variantes[id] = (variantes[id] || 0) + 1;
  delete borradores[id];
  pintar();
}

function pausar(id){
  const p = estado.personas.find(x => x.id === id);
  if(!p) return;
  const dias = prompt("¿Cuántos días quiere pausar los mensajes de " + p.nombre + "?\n\n(Escribe un número. Su lugar se guarda.)", "7");
  if(dias === null) return;
  const n = parseInt(dias, 10);
  if(!(n > 0)){ brindar("Escribe un número de días"); return; }
  const f = new Date(); f.setDate(f.getDate() + n);
  p.pausadoHasta = hoyISO(f);
  guardar(); pintar();
  brindar(p.nombre + " en pausa " + n + " días");
}

function reanudar(id){
  const p = estado.personas.find(x => x.id === id);
  if(!p) return;
  p.pausadoHasta = null; p.activo = true;
  guardar(); pintar();
  brindar("Se reanudan los mensajes de " + p.nombre);
}

function darDeBaja(id){
  const p = estado.personas.find(x => x.id === id);
  if(!p) return;
  if(!confirm("Dar de baja a " + p.nombre + " y borrar su teléfono.\n\nEsto no se puede deshacer. Es lo correcto cuando alguien pide salir.\n\n¿Continuar?")) return;
  estado.personas = estado.personas.filter(x => x.id !== id);
  guardar(); pintar();
  brindar("Se dio de baja a " + p.nombre);
}

  cont.innerHTML = html;
}

      </div>

          <span>La copia, en texto</span>
        </label>
        <textarea class="borrador" id="respaldoTexto" spellcheck="false"
          style="border-radius:9px;font-size:13px;min-height:104px" aria-label="Copia de respaldo en texto"
          placeholder="Al exportar, la copia aparece aquí para que la selecciones y la guardes en una nota. También puedes pegar aquí una copia anterior y restaurarla."></textarea>
        <div class="botones" style="margin-top:10px">

    <div class="aviso">

      alegre encima. Y pásale una línea de ayuda sin cortarle la conversación.

      <div style="margin-top:10px">Verifica estos números en tu país cada seis meses.</div>
    </div>`;

  document.getElementById("guardarAjustes").onclick = () => {
    a.canal = document.getElementById("ajCanal").value;
    a.lada  = document.getElementById("ajLada").value.trim();
    a.firma = document.getElementById("ajFirma").value.trim();
    guardar(); pintar();
    brindar("Ajustes guardados");
  };

  // Restaura desde el texto de una copia. Devuelve true si se aplicó.
  function restaurarDesde(texto){
    let d;
    try{ d = JSON.parse(texto); }catch(e){ brindar("Esa copia no se pudo leer"); return false; }
    if(!d || !Array.isArray(d.personas)){ brindar("Esa copia no tiene una lista de personas"); return false; }
    if(!confirm("Esto reemplaza la lista actual (" + estado.personas.length + " personas) por la de la copia (" + d.personas.length + "). ¿Continuar?")) return false;
    estado.personas = d.personas;
    estado.ajustes = Object.assign({}, AJUSTES_INICIALES, d.ajustes || {});
    guardar(); pintar();
    brindar("Restaurado: " + d.personas.length + " personas");
    return true;
  }

  // Guardar el archivo depende de dónde se esté usando la app: abierta como página
  // publicada, la descarga la media el visor; abierta como archivo, la hace el navegador.
  // Si ninguna procede, la copia igual queda a la vista y en el portapapeles.
  async function bajarArchivo(nombre, json){
    try{
      const descargas = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if(descargas){
        await descargas.save({filename: nombre, data: json});
        return "guardado";
      }
    }catch(e){
      return (e && e.code === "declined") ? "cancelado" : "no";
    }
    try{
      const url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
      const liga = document.createElement("a");
      liga.href = url;
      liga.download = nombre;
      liga.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return "guardado";
    }catch(e){ return "no"; }
  }

  document.getElementById("exportar").onclick = async () => {
    const json = JSON.stringify({version:1, exportado:hoyISO(), personas:estado.personas, ajustes:estado.ajustes}, null, 2);

    const texto = document.getElementById("respaldoTexto");
    texto.value = json;
    texto.scrollIntoView({block:"nearest"});

    let copio = false;
    try{ await navigator.clipboard.writeText(json); copio = true; }catch(e){ /* sin permiso al portapapeles */ }

    const archivo = await bajarArchivo("un-mensaje-para-ti-" + hoyISO() + ".json", json);
    if(archivo === "guardado")      brindar(copio ? "Copia guardada y en el portapapeles" : "Copia guardada");
    else if(archivo === "cancelado") brindar("No se guardó el archivo. La copia quedó aquí abajo");
    else                             brindar(copio ? "Copia en el portapapeles y aquí abajo"
                                                   : "Copia lista aquí abajo — selecciónala y guárdala");
  };

  document.getElementById("restaurarPegado").onclick = () => {
    const texto = document.getElementById("respaldoTexto").value.trim();
    if(!texto){ brindar("Pega aquí el texto de una copia"); return; }
    restaurarDesde(texto);
  };

  const archivo = document.getElementById("archivo");
  document.getElementById("importar").onclick = () => archivo.click();
  archivo.onchange = () => {
    const f = archivo.files[0];
    if(!f) return;
    const lector = new FileReader();
    lector.onload = () => { restaurarDesde(lector.result); archivo.value = ""; };
    lector.onerror = () => { brindar("Ese archivo no se pudo abrir"); archivo.value = ""; };
    lector.readAsText(f);
  };
}

/* ─────────────────────────────────────────────────────────────
   Armado general
   ───────────────────────────────────────────────────────────── */
function irA(vista){
  vistaActual = vista;
  document.querySelectorAll("nav.pestanas button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.vista === vista)));
  ["hoy","personas","mensajes","ajustes"].forEach(v =>
    document.getElementById("vista-" + v).hidden = (v !== vista));
  pintar();
  window.scrollTo({top:0, behavior:"smooth"});
}

function pintar(){
  document.getElementById("tituloProyecto").textContent = estado.ajustes.nombreProyecto;

  const pendientes = estado.personas.filter(leTocaHoy).length;
  const globo = document.getElementById("globoHoy");
  globo.textContent = pendientes;
  globo.hidden = pendientes === 0;

  const dia = DIAS[new Date().getDay()];
  document.getElementById("subtitulo").textContent =
    dia.charAt(0).toUpperCase() + dia.slice(1) + " · " +
    (pendientes ? pendientes + " por mandar" : "nada pendiente");

  if(vistaActual === "hoy")      pintarHoy();
  if(vistaActual === "personas") pintarPersonas();
  if(vistaActual === "mensajes") pintarMensajes();
  if(vistaActual === "ajustes")  pintarAjustes();
}

document.querySelectorAll("nav.pestanas button").forEach(b =>
  b.addEventListener("click", () => irA(b.dataset.vista)));

// Un solo escucha para todo lo que se pinta y repinta.
document.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if(!b) return;
  if(b.dataset.enviar){
    const p = estado.personas.find(x => x.id === b.dataset.enviar);
    if(!p) return;
    const caja = document.querySelector('[data-borrador="' + p.id + '"]');
    const texto = caja ? caja.value : "";
    if(!texto.trim()){ brindar("El mensaje está vacío"); return; }
    window.open(ligaEnvio(p, texto), "_blank", "noopener");
    marcarEnviado(p.id, Number(b.dataset.mensaje));
  }
  else if(b.dataset.hecho)    marcarEnviado(b.dataset.hecho, Number(b.dataset.mensaje));
  else if(b.dataset.otro)     otroMensaje(b.dataset.otro);
  else if(b.dataset.pausa)    pausar(b.dataset.pausa);
  else if(b.dataset.reanudar) reanudar(b.dataset.reanudar);
  else if(b.dataset.baja)     darDeBaja(b.dataset.baja);
});

// Conservar lo que la persona editó a mano mientras no se repinte.
document.addEventListener("input", ev => {
  const t = ev.target;
  if(t.dataset && t.dataset.borrador) borradores[t.dataset.borrador] = t.value;
});

pintar();
</script>
